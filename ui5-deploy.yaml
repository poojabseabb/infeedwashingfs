# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: com.ewm.infeedwashingfs
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        ignoreCertErrors: true
        target:
          url: https://vhbfeds4ci.sap.ewm.se.abb.com:44300
          client: '100'
        app:
          name: ZINFEEDWASHINGF
          description: Washing Infeed Station New Freestyle
          package: ZEWM_FIORI_PKG
          transport: DS4K902211
        exclude:
          - /test/
          - /localService/
